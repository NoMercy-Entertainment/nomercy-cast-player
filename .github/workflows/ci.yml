name: CI

on:
  push:
    branches-ignore:
      - master
      - gh-pages
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, beast-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Same runner and same defect as pages.yml: node_modules/.bin is on a noexec mount,
      # so `yarn <script>` dies with "permission denied" before doing any work and chmod
      # cannot grant the bit. node reads these entry points as plain files instead.
      #
      # The arguments must stay in step with the matching package.json scripts.
      - name: Typecheck
        run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit

      - name: Lint
        run: node node_modules/eslint/bin/eslint.js . --ext .ts,.vue --report-unused-disable-directives --max-warnings 0

      - name: Build
        run: node node_modules/vite/bin/vite.js build
