name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - yarn.lock
      - index.html
      - vite.config.ts
      - tsconfig.json
      - tailwind.config.cjs
      - .github/workflows/pages.yml
    branches:
      - master

jobs:
  deploy:
    timeout-minutes: 7200
    runs-on: [self-hosted, Linux, X64, beast-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Invoked through node rather than `yarn <script>` because the beast-unit runner
      # cannot execute anything in node_modules/.bin: every such script dies with
      # "permission denied: vue-tsc" before doing any work. chmod +x does not help — the
      # step succeeds and the next one still fails — so the directory is on a noexec
      # mount and no change inside the repo can grant the bit. node reads these entry
      # points as plain files, which needs no executable bit at all.
      #
      # The arguments below must stay in step with the matching package.json scripts,
      # which are what a developer runs locally.
      - name: Typecheck
        run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit

      - name: Lint
        run: node node_modules/eslint/bin/eslint.js . --ext .ts,.vue --report-unused-disable-directives --max-warnings 0

      - name: Test
        run: node node_modules/vitest/vitest.mjs run

      - name: Build
        run: node node_modules/vite/bin/vite.js build

      # cast.nomercy.tv is the Cloudflare Pages project cast-nomercy-tv. This step
      # used to publish to GitHub Pages, which only redirects to that domain, so
      # from 2026-09-11 the domain kept serving the deleted Kotlin/Wasm receiver
      # and no Vue build reached a Chromecast. The master branch is production;
      # a manual run from any other branch makes a preview deployment.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy docs
          --project-name=cast-nomercy-tv
          --branch=${{ github.ref_name }}
          --commit-hash=${{ github.sha }}
