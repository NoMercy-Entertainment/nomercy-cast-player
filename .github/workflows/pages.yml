name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - package.json
      - yarn.lock
      - index.html
      - vite.config.ts
      - tsconfig.json
      - tailwind.config.cjs
    branches:
      - master

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, beast-unit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Invoked through node rather than `yarn <script>` because the beast-unit runner
      # cannot execute anything in node_modules/.bin: every such script dies with
      # "permission denied: vue-tsc" before doing any work. chmod +x does not help — the
      # step succeeds and the next one still fails — so the directory is on a noexec
      # mount and no change inside the repo can grant the bit. node reads these entry
      # points as plain files, which needs no executable bit at all.
      #
      # The arguments below must stay in step with the matching package.json scripts,
      # which are what a developer runs locally.
      - name: Typecheck
        run: node node_modules/vue-tsc/bin/vue-tsc.js --noEmit

      - name: Lint
        run: node node_modules/eslint/bin/eslint.js . --ext .ts,.vue --report-unused-disable-directives --max-warnings 0

      - name: Build
        run: node node_modules/vite/bin/vite.js build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          cname: cast.nomercy.tv
