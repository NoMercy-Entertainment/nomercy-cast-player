<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link href="/favicon.ico" rel="icon" type="image/svg+xml" />

		<meta
			content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
			name="viewport"
		/>

		<title>NoMercy Cast Receiver</title>

		<meta content="NoMercy Cast Receiver" property="og:title" />
		<meta content="website" property="og:type" />
		<meta content="https://cast.nomercy.tv" property="og:url" />
		<meta content="NoMercy" property="og:site_name" />
		<meta content="en_US" property="og:locale" />

		<link rel="preload" as="image" href="/src/assets/splash.png" />

		<!-- SPA deep-link redirect for GitHub Pages — see public/404.html -->
		<script>
			(function (l) {
				if (l.search[1] === '/') {
					var decoded = l.search
						.slice(1)
						.split('&')
						.map(function (s) {
							return s.replace(/~and~/g, '&');
						})
						.join('?');
					window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
				}
			})(window.location);
		</script>

		<!-- Cast Application Framework — required globals -->
		<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
	</head>
	<body class="cast-receiver-root">
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
