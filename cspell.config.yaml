# American English in code, comments and copy. `yarn lint:spelling` runs `--report flagged`: only
# the words below fail, each with its American spelling, so jargon and names never trip it.
version: '0.2'
language: en-US
files:
  - 'src/**/*.{ts,vue,json,css}'
  - 'scripts/**/*.mjs'
  - '*.{ts,js,html}'
flagWords:
  - analyse->analyze
  - analysed->analyzed
  - analyses->analyzes
  - analysing->analyzing
  - apologise->apologize
  - artefact->artifact
  - artefacts->artifacts
  - authorise->authorize
  - authorised->authorized
  - authorises->authorizes
  - authorising->authorizing
  - authorisation->authorization
  - behaviour->behavior
  - behaviours->behaviors
  - cancelled->canceled
  - cancelling->canceling
  - catalogue->catalog
  - catalogues->catalogs
  - categorise->categorize
  - categorised->categorized
  - centre->center
  - centred->centered
  - centres->centers
  - cheque->check
  - colour->color
  - coloured->colored
  - colourful->colorful
  - colouring->coloring
  - colours->colors
  - customise->customize
  - customised->customized
  - customising->customizing
  - defence->defense
  - dialogue->dialog
  - emphasise->emphasize
  - favour->favor
  - favourite->favorite
  - favourites->favorites
  - finalise->finalize
  - finalised->finalized
  - grey->gray
  - greyed->grayed
  - honour->honor
  - honours->honors
  - initialise->initialize
  - initialised->initialized
  - initialising->initializing
  - initialisation->initialization
  - labelled->labeled
  - labelling->labeling
  - licence->license
  - maximise->maximize
  - minimise->minimize
  - modelled->modeled
  - modelling->modeling
  - neighbour->neighbor
  - normalise->normalize
  - normalised->normalized
  - normalising->normalizing
  - offence->offense
  - optimise->optimize
  - optimised->optimized
  - organise->organize
  - organised->organized
  - organisation->organization
  - prioritise->prioritize
  - prioritised->prioritized
  - recognise->recognize
  - recognised->recognized
  - recognises->recognizes
  - serialise->serialize
  - serialised->serialized
  - signalled->signaled
  - summarise->summarize
  - synchronise->synchronize
  - travelled->traveled
  - unrecognised->unrecognized
  - visualise->visualize
  - whilst->while
# `aria-labelledby` is the HTML attribute's own name.
ignoreRegExpList:
  - aria-labelledby
  - ariaLabelledby
